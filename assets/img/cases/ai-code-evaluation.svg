<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#0A0A0A"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">
    <rect x="110" y="110" width="980" height="530" rx="18" fill="#141414" stroke="#2A2A2A" stroke-width="2"/>
    <circle cx="150" cy="150" r="9" fill="#3A3A3A"/><circle cx="182" cy="150" r="9" fill="#3A3A3A"/><circle cx="214" cy="150" r="9" fill="#3A3A3A"/>
    <g fill="#6B6B6B"><text x="140" y="228">1</text><text x="140" y="276">2</text><text x="140" y="324">3</text><text x="140" y="372">4</text><text x="140" y="420">5</text><text x="140" y="468">6</text><text x="140" y="516">7</text></g>
    <rect x="124" y="296" width="952" height="44" fill="#FF3B30" fill-opacity=".2"/>
    <rect x="124" y="296" width="5" height="44" fill="#FF3B30"/>
    <rect x="124" y="344" width="952" height="44" fill="#34C759" fill-opacity=".18"/>
    <rect x="124" y="344" width="5" height="44" fill="#34C759"/>
    <g fill="#D8D8D8">
      <text x="190" y="228"><tspan fill="#FF5A1F">function</tspan> total(items) {</text>
      <text x="220" y="276"><tspan fill="#FF5A1F">let</tspan> sum = <tspan fill="#9CDCFE">0</tspan>;</text>
      <text x="220" y="324"><tspan fill="#FF5A1F">for</tspan> (<tspan fill="#FF5A1F">let</tspan> i = <tspan fill="#9CDCFE">0</tspan>; i <tspan fill="#FF8A80">&lt;=</tspan> items.length; i++)</text>
      <text x="220" y="372"><tspan fill="#FF5A1F">for</tspan> (<tspan fill="#FF5A1F">let</tspan> i = <tspan fill="#9CDCFE">0</tspan>; i <tspan fill="#7EE2A0">&lt;</tspan> items.length; i++)</text>
      <text x="250" y="420">sum += items[i].price;</text>
      <text x="220" y="468"><tspan fill="#FF5A1F">return</tspan> sum;</text>
      <text x="190" y="516">}</text>
    </g>
    <g font-weight="700" fill="#0A0A0A">
      <rect x="890" y="300" width="170" height="36" rx="18" fill="#FF3B30"/>
      <text x="912" y="326" font-size="22">bug: &lt;=</text>
      <rect x="890" y="348" width="170" height="36" rx="18" fill="#34C759"/>
      <text x="912" y="374" font-size="22">fix: &lt;</text>
    </g>
  </g>
